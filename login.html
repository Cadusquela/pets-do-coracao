<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login Administrativo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: "Poppins";
  background: #F1FAEE;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.login-box {
  background: #fff;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  width: 500px;
}
.login-box h2 {
  text-align: center;
  margin-bottom: 20px;
}
input {
  width: 94%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: 2px solid #A8DADC;
  font-size: 15px;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 20px;
  background: #FFCDB2;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
}
#error {
  color: red;
  font-size: 14px;
  margin-top: 10px;
  text-align: center;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>Acesso Administrativo</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Digite a senha">
  <button onclick="login()">Entrar</button>
  <p id="error"></p>
</div>

<script src="https://mcp.supabase.com/mcp?project_ref=wofnhccvyghtoykowsfi"></script>
<script>
const supabase = supabase.createClient(
  "https://wofnhccvyghtoykowsfi.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvZm5oY2N2eWdodG95a293c2ZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NzI3NjksImV4cCI6MjA3OTA0ODc2OX0.TcKp3_oBSM7P0azu_BNjepBKwXXm9hA7Zp6iupdWfE0"
);

async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if(error){
    document.getElementById("error").textContent = "Senha incorreta!";
  } else {
    window.location.href = "admin.html";
  }
}
</script>
</body>
</html>
